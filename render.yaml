services:
  - type: web
    name: krishna-decor-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node api/src/cloud-server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
